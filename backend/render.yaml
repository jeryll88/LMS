services:
  - type: web
    name: school-library-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
